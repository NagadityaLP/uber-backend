server:
  port: 8086

dispatch:
  search-radius-km: 5.0

spring:
  datasource:
    url: jdbc:postgresql://localhost:5437/dispatch_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        jdbc:
          time_zone: UTC