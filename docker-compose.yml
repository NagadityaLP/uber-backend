services:
  user-db:
    image: 'postgres:16'
    container_name: user-service-postgres
    environment:
      - 'POSTGRES_DB=user_db'
      - 'POSTGRES_USER=postgres'
      - 'POSTGRES_PASSWORD=root123'
    ports:
      - "5433:5432"
    volumes:
      - user_postgres_data:/var/lib/postgresql/data

  driver-db:
    image: 'postgres:16'
    container_name: driver-service-postgres
    environment:
      - 'POSTGRES_DB=driver_db'
      - 'POSTGRES_USER=postgres'
      - 'POSTGRES_PASSWORD=root123'
    ports:
      - "5434:5432"
    volumes:
      - driver_postgres_data:/var/lib/postgresql/data

  redis:
    image: 'redis:7'
    container_name: location-service-redis
    ports:
      - "6379:6379"

  pricing-db:
    image: 'postgres:16'
    container_name: pricing-service-postgres
    environment:
      - 'POSTGRES_DB=pricing_db'
      - 'POSTGRES_USER=postgres'
      - 'POSTGRES_PASSWORD=root123'
    ports:
      - "5435:5432"
    volumes:
      - pricing_postgres_data:/var/lib/postgresql/data

  trip-db:
    image: 'postgres:16'
    container_name: trip-service-postgres
    environment:
      - 'POSTGRES_DB=trip_db'
      - 'POSTGRES_USER=postgres'
      - 'POSTGRES_PASSWORD=root123'
    ports:
      - "5436:5432"
    volumes:
      - trip_postgres_data:/var/lib/postgresql/data

  dispatch-db:
    image: 'postgres:16'
    container_name: dispatch-service-postgres
    environment:
      - 'POSTGRES_DB=dispatch_db'
      - 'POSTGRES_USER=postgres'
      - 'POSTGRES_PASSWORD=root123'
    ports:
      - "5437:5432"
    volumes:
      - dispatch_postgres_data:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:4.0.1
    container_name: uber-backend-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

volumes:
  user_postgres_data:
  driver_postgres_data:
  pricing_postgres_data:
  trip_postgres_data:
  dispatch_postgres_data: