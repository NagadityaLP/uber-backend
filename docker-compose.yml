services:
  user-db:
    image: 'postgres:16'
    container_name: user-service-postgres
    environment:
      - 'POSTGRES_DB=user_db'
      - 'POSTGRES_USER=postgres'
      - 'POSTGRES_PASSWORD=root123'
    ports:
      - "5433:5432"
    volumes:
      - user_postgres_data:/var/lib/postgresql/data

  driver-db:
    image: 'postgres:16'
    container_name: driver-service-postgres
    environment:
      - 'POSTGRES_DB=driver_db'
      - 'POSTGRES_USER=postgres'
      - 'POSTGRES_PASSWORD=root123'
    ports:
      - "5434:5432"
    volumes:
      - driver_postgres_data:/var/lib/postgresql/data

  redis:
    image: 'redis:7'
    container_name: location-service-redis
    ports:
      - "6379:6379"

volumes:
  user_postgres_data:
  driver_postgres_data: